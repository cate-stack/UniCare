
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | UniCare</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="registration-wrapper">

    <div class="registration-header">
        <div class="brand">
            <span class="brand-icon">+</span>
            <span>UniCare</span>
        </div>

        <h1>Create Your Student Account</h1>
        <p>Register to access your university dispensary services.</p>
    </div>

    <div class="registration-card">

        <h2>Student Information</h2>
        <p class="form-subtitle">
            Please provide accurate information to create your account.
        </p>

        <form id="registrationForm">

            <div class="registration-grid">

                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                        minlength="3"
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="studentNumber">Student Registration Number *</label>
                    <input
                        type="text"
                        id="studentNumber"
                        placeholder="e.g. ABC/1234/2026"
                        required
                        maxlength="30"
                    >
                </div>

                <div class="form-group">
                    <label for="email">University Email *</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        maxlength="120"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input
                        type="tel"
                        id="phone"
                        pattern="[0-9+ \-]{9,16}"
                        required 
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course / Programme *</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter your course"
                        required
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="yearOfStudy">Year of Study *</label>
                    <select id="yearOfStudy" required>
                        <option value="">Select year</option>
                        <option value="Year 1">Year 1</option>
                        <option value="Year 2">Year 2</option>
                        <option value="Year 3">Year 3</option>
                        <option value="Year 4">Year 4</option>
                        <option value="Year 5">Year 5</option>
                        <option value="Year 6">Year 6</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Create Password *</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 8 characters"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                        minlength="8"
                    >
                </div>

            </div>

            <div class="form-group terms-group">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    I confirm that the information provided is accurate.
                </label>
            </div>

            <button type="submit" class="primary-btn">
                Create Account
            </button>

            <p id="registrationMessage" class="message"></p>

        </form>

        <p class="register-link">
            Already have an account?
            <a href="../index.html">Sign in here</a>
        </p>

    </div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
